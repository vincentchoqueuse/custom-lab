# Deploy the static build to GitHub Pages on every push to main.
# The app is fully static (relative base + hash routing), so it works from a
# project-page subpath with no extra configuration.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time, and NEVER cancel one that has started.
#
# This was `cancel-in-progress: true`, which is right for a CI check and wrong
# for a deployment: a push that lands while the previous one is still
# publishing kills it mid-flight, and Pages is left with a cancelled
# deployment for that commit. Two pushes twenty minutes apart were enough —
# both deploys timed out waiting on a status that was never going to come, and
# a manual re-run then hit `Deployment cancelled` in five seconds because a
# deployment for the same SHA was already stuck in that state.
#
# `false` is what GitHub's own Pages template uses, for exactly this reason:
# queued runs collapse to the latest, but whatever is already publishing is
# allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # v5 and not v3: the runner now defaults to Node 24 and these two were
      # built for Node 20. They are a PAIR — the artifact format is shared —
      # so they move together or not at all. checkout and setup-node stay on
      # v4 deliberately: they carry the same deprecation warning and have
      # never once failed here, so there is no evidence to act on.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
