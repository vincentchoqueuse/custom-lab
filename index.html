<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%2318181b'/%3E%3Cline x1='6' y1='23' x2='26' y2='23' stroke='%2371717a' stroke-width='1.4' stroke-linecap='round'/%3E%3Cpath d='M6 23c4 0 5.5-13 10-13s6 13 10 13' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Custom Lab</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Startup watchdog (plain ES5, runs everywhere): if the app bundle
      // fails to execute — stale cached page referencing replaced assets,
      // or a script error on this browser — never leave a blank page:
      // show what happened and offer a reload.
      (function () {
        var errors = [];
        window.addEventListener(
          'error',
          function (e) {
            var target = e.target || {};
            errors.push(e.message || target.src || target.href || 'resource failed to load');
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          errors.push((e.reason && e.reason.message) || String(e.reason));
        });
        setTimeout(function () {
          var app = document.getElementById('app');
          if (!app || app.children.length > 0) return;
          app.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 20px;color:#18181b">' +
            '<h1 style="font-size:18px">Custom Lab failed to start</h1>' +
            '<p style="color:#52525b;font-size:14px">The application script did not run. ' +
            'This usually means a cached page is pointing at outdated files after a deployment.</p>' +
            '<p><button onclick="location.reload()" style="padding:9px 16px;border:1px solid #18181b;' +
            'border-radius:8px;background:#18181b;color:#fff;font-size:14px;cursor:pointer">Reload</button></p>' +
            (errors.length
              ? '<pre style="white-space:pre-wrap;background:#f4f4f5;padding:12px;border-radius:8px;' +
                'font-size:12px;color:#52525b">' +
                errors.join('\n').replace(/</g, '&lt;') +
                '</pre>'
              : '') +
            '</div>';
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
