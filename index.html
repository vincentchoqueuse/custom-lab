<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The enamelled route plate: a trail is numbered, and this one is numbered
         34 — the GR that runs the Breton coast. The SAME drawing as
         ui/AppIcon.svelte, to the last stroke; any retouch happens on BOTH
         sides, because they diverged once and the tab moved while the screen
         stayed put.
         Two differences are deliberate and bounded. The plate carries its own
         `prefers-color-scheme` here: the digits are masked OUT, so they show the
         tab strip through them and one ground colour is all that has to flip —
         no second drawing has to exist. And the digits fall back to the platform
         UI face: a `data:` URI reaches no webfont, so IBM Plex Sans cannot
         follow the mark into the tab. Reserved out of a solid ground rather than
         stroked, the shape survives that substitution at 16 px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E*{color:%2318181b}@media(prefers-color-scheme:dark){*{color:%23fafafa}}%3C/style%3E%3Cmask id='p'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect x='3.3' y='3.3' width='25.4' height='25.4' rx='4.4' fill='none' stroke='%23000' stroke-width='1.1'/%3E%3Ctext x='16' y='21.3' text-anchor='middle' fill='%23000' font-size='13.6' font-weight='600' letter-spacing='.1' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif'%3E34%3C/text%3E%3C/mask%3E%3Crect x='.6' y='.6' width='30.8' height='30.8' rx='6.6' fill='currentColor' mask='url(%23p)'/%3E%3C/svg%3E"
    />
    <title>expe34</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Compatibility polyfills for older classroom tablets (plain ES5).
      // Svelte 5 needs structuredClone (Safari 15.4+), queueMicrotask
      // (Safari 12.1+) and globalThis (Safari 12.1+).
      window.globalThis || (window.globalThis = window);
      window.queueMicrotask ||
        (window.queueMicrotask = function (cb) {
          Promise.resolve().then(cb);
        });
      window.structuredClone ||
        (window.structuredClone = function (v) {
          // plain-data fallback — sufficient for the app's param snapshots
          return v === undefined ? v : JSON.parse(JSON.stringify(v));
        });

      // Startup watchdog (plain ES5, runs everywhere): never leave a blank
      // page. Errors render immediately; a 4 s timer covers silent failures.
      (function () {
        var errors = [];
        function render() {
          var app = document.getElementById('app');
          if (!app || app.children.length > 0) return;
          app.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 20px;color:#18181b">' +
            '<h1 style="font-size:18px">expe34 failed to start</h1>' +
            '<p style="color:#52525b;font-size:14px">The application script did not run. ' +
            'This usually means an unsupported browser feature or a cached page pointing at outdated files.</p>' +
            '<p><button onclick="location.reload()" style="padding:9px 16px;border:1px solid #18181b;' +
            'border-radius:8px;background:#18181b;color:#fff;font-size:14px;cursor:pointer">Reload</button></p>' +
            (errors.length
              ? '<pre style="white-space:pre-wrap;background:#f4f4f5;padding:12px;border-radius:8px;' +
                'font-size:12px;color:#52525b">' +
                errors.join('\n').replace(/</g, '&lt;') +
                '</pre>'
              : '') +
            '</div>';
        }
        window.__bootReport = function (msg) {
          errors.push(String(msg));
          errors.length === 1 && errors.push('UA: ' + navigator.userAgent);
          render();
        };
        window.addEventListener(
          'error',
          function (e) {
            var target = e.target || {};
            window.__bootReport(
              e.message || target.src || target.href || 'resource failed to load'
            );
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          window.__bootReport((e.reason && e.reason.message) || String(e.reason));
        });
        setTimeout(render, 4000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
