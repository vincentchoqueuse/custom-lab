<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The figure on its axis: a Gaussian bell standing on its axis line,
         reserved out of a solid plate. The SAME drawing as ui/AppIcon.svelte,
         to the last stroke; any retouch happens on BOTH sides, because they
         diverged once and the tab moved while the screen stayed put.
         One deliberate difference: the plate carries its own
         `prefers-color-scheme` here — the drawing is masked OUT, so it shows
         the tab strip through it and one ground colour is all that has to
         flip; no second drawing has to exist. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E*{color:%2318181b}@media(prefers-color-scheme:dark){*{color:%23fafafa}}%3C/style%3E%3Cmask id='p'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cline x1='6.4' y1='22.8' x2='25.6' y2='22.8' stroke='%23000' stroke-width='1.7' stroke-linecap='round'/%3E%3Cpath d='M 7.6 22.8 C 12.4 22.8 12.9 8.9 16 8.9 C 19.1 8.9 19.6 22.8 24.4 22.8' fill='none' stroke='%23000' stroke-width='2.5' stroke-linecap='round'/%3E%3C/mask%3E%3Crect x='.6' y='.6' width='30.8' height='30.8' rx='6.6' fill='currentColor' mask='url(%23p)'/%3E%3C/svg%3E"
    />
    <title>pupitra</title>
    <script>
      // THE THEME, BEFORE FIRST PAINT — the stored choice (the same
      // `pupitra:theme` key core/prefs.js owns; duplicated here because this
      // must run before any module loads), else the system's. Without this,
      // every reload in dark mode flashes white for as long as the bundle
      // takes to arrive.
      try {
        var theme = localStorage.getItem('pupitra:theme');
      } catch (e) {
        var theme = null;
      }
      if (theme !== 'light' && theme !== 'dark')
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Compatibility polyfills for older classroom tablets (plain ES5).
      // Svelte 5 needs structuredClone (Safari 15.4+), queueMicrotask
      // (Safari 12.1+) and globalThis (Safari 12.1+).
      window.globalThis || (window.globalThis = window);
      window.queueMicrotask ||
        (window.queueMicrotask = function (cb) {
          Promise.resolve().then(cb);
        });
      window.structuredClone ||
        (window.structuredClone = function (v) {
          // plain-data fallback — sufficient for the app's param snapshots
          return v === undefined ? v : JSON.parse(JSON.stringify(v));
        });

      // Startup watchdog (plain ES5, runs everywhere): never leave a blank
      // page. Errors render immediately; a 4 s timer covers silent failures.
      (function () {
        var errors = [];
        function render() {
          var app = document.getElementById('app');
          if (!app || app.children.length > 0) return;
          app.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 20px;color:#18181b">' +
            '<h1 style="font-size:18px">pupitra failed to start</h1>' +
            '<p style="color:#52525b;font-size:14px">The application script did not run. ' +
            'This usually means an unsupported browser feature or a cached page pointing at outdated files.</p>' +
            '<p><button onclick="location.reload()" style="padding:9px 16px;border:1px solid #18181b;' +
            'border-radius:8px;background:#18181b;color:#fff;font-size:14px;cursor:pointer">Reload</button></p>' +
            (errors.length
              ? '<pre style="white-space:pre-wrap;background:#f4f4f5;padding:12px;border-radius:8px;' +
                'font-size:12px;color:#52525b">' +
                errors.join('\n').replace(/</g, '&lt;') +
                '</pre>'
              : '') +
            '</div>';
        }
        window.__bootReport = function (msg) {
          errors.push(String(msg));
          errors.length === 1 && errors.push('UA: ' + navigator.userAgent);
          render();
        };
        window.addEventListener(
          'error',
          function (e) {
            var target = e.target || {};
            window.__bootReport(
              e.message || target.src || target.href || 'resource failed to load'
            );
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          window.__bootReport((e.reason && e.reason.message) || String(e.reason));
        });
        setTimeout(render, 4000);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
